name: Sign and release IPA



on:

  workflow_dispatch:
  
    inputs:
    
      source_tag:
      
        description: "Tag da Release que contém a IPA de origem"
        
        required: true
        
        default: "v1.0.1"
        
      version:
      
        description: "Versão da nova Release"
        
        required: true
        
        default: "1.0.2"
        


permissions:

  contents: write
  


env:

  SOURCE_REPOSITORY: nayarafogaca694-ux/ios-ipa-installer
  


jobs:

  sign-and-release:
  
    runs-on: macos-14
    
    steps:
    
      - name: Checkout do site
      
        uses: actions/checkout@v4
        


      - name: Baixar a IPA da Release de origem
      
        shell: bash
        
        env:
        
          GH_TOKEN: ${{ github.token }}
          
          SOURCE_TAG: ${{ inputs.source_tag }}
          
        run: |
        
          set -euo pipefail
          
          mkdir -p "$RUNNER_TEMP/payload"
          
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPOSITORY" --pattern '*.ipa' --dir "$RUNNER_TEMP/payload" --clobber
          
          IPA_SOURCE="$(find "$RUNNER_TEMP/payload" -maxdepth 1 -name '*.ipa' -print -quit)"
          
          test -n "$IPA_SOURCE"
          
          echo "IPA_SOURCE=$IPA_SOURCE" >> "$GITHUB_ENV"
          


      - name: Importar certificado e provisioning profile
      
        shell: bash
        
        env:
        
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          
        run: |
        
          set -euo pipefail
          
          SIGN_DIR="$RUNNER_TEMP/ios-signing"
          
          mkdir -p "$SIGN_DIR"
          
          CERT_PATH="$SIGN_DIR/certificate.p12"
          
          PROFILE_PATH="$SIGN_DIR/profile.mobileprovision"
          
          KEYCHAIN_PATH="$SIGN_DIR/build.keychain-db"
          
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          
          test -s "$CERT_PATH"
          
          test -s "$PROFILE_PATH"
          
          security create-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          
          security unlock-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          
          security default-keychain -s "$KEYCHAIN_PATH"
          
          security set-key-partition-list -S apple-tool:,apple: -s -k "build-keychain-password" "$KEYCHAIN_PATH"
          
          security cms -D -i "$PROFILE_PATH" > "$SIGN_DIR/profile.plist"
          
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")"
          
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '\"' '/1\)/ {print $2; exit}')"
          
          test -n "$SIGNING_IDENTITY"
          
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          


      - name: Reassinar o aplicativo e recriar a IPA
      
        shell: bash
        
        env:
        
          NEW_VERSION: ${{ inputs.version }}
          
        run: |
        
          set -euo pipefail
          
          WORK_DIR="$RUNNER_TEMP/work"
          
          mkdir -p "$WORK_DIR"
          
          unzip -q "$IPA_SOURCE" -d "$WORK_DIR"
          
          APP_PATH="$(find "$WORK_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          
          test -d "$APP_PATH"
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" "$APP_PATH/Info.plist"
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP_PATH/Info.plist"
          
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"
          
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          
          if [ -d "$APP_PATH/Frameworks" ]; then
          
            find "$APP_PATH/Frameworks" -type f -perm -111 -print0 | while IFS= read -r -d '' item; do
            
              codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp=none "$item"
              
            done
            
          fi
          
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp=none "$APP_PATH"
          
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          
          IPA_OUTPUT="$RU




















































































